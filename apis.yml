aid: thomas
name: Thomas
description: >-
  Thomas is a Y Combinator-backed startup (Spring 2026 batch) based in San Francisco,
  building what it describes as the world's first AI founder: an autonomous AI agent
  that starts, runs, and grows its own companies on the internet end to end. Founded by
  Thomas Cloarec (the company was formerly named HireThomas, Inc. / MadeByThomas), it
  operates a public marketing site at madebythomas.ai. As of this profile the company
  publishes no public developer API, OpenAPI definition, SDKs, CLI, or developer
  documentation; the site is a single-page marketing application and its internal
  /api/ and /events/ routes are explicitly disallowed to crawlers via robots.txt.
